name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Eval gate (offline assistant, no cloud calls)
        run: python -m evalharness run --out out
      - name: Prove the gate blocks a build without guardrails
        run: |
          if python -m evalharness run --variant unsafe --out out-unsafe; then
            echo "The gate should have failed the unsafe build"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            out/
            out-unsafe/
